<title>Alternative-ring sketch</title><style>
:root{--bg:#eef0f5;--panel:#f7f8fb;--sunk:#e3e7ef;--ink:#181d29;--soft:#4d566b;
  --faint:#7b849a;--line:#cfd5e2;--accent:#2f4fd8;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}
@media(prefers-color-scheme:dark){:root{--bg:#0d1017;--panel:#141924;--sunk:#0a0d13;
  --ink:#dde3ef;--soft:#9aa4bb;--faint:#6d7690;--line:#272e3d;--accent:#8ea3ff;}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;}
.shell{display:flex;flex-direction:column;height:100vh;}
header{display:flex;gap:20px;justify-content:space-between;align-items:flex-end;
  flex-wrap:wrap;padding:16px 20px 13px;border-bottom:1px solid var(--line);}
.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);font-weight:650;}
h1{margin:4px 0 0;font-size:20px;font-weight:600;letter-spacing:-.01em;}
.sub{margin:3px 0 0;font-size:12px;color:var(--faint);font-family:var(--mono);}
.keys{display:flex;flex-wrap:wrap;gap:7px;}
.key{display:flex;align-items:center;gap:6px;font:inherit;font-size:11.5px;
  color:var(--soft);background:transparent;border:1px solid transparent;
  border-radius:5px;padding:4px 8px;cursor:pointer;}
.key:hover{border-color:var(--line);}
.key.off{opacity:.4;}
.key i{width:11px;height:11px;border-radius:3px;border:1.4px solid;display:block;}
.key b{font-variant-numeric:tabular-nums;color:var(--ink);}
.body{display:flex;flex:1;min-height:0;}
.canvas{flex:1;overflow:auto;padding:18px;min-width:0;}
#canvas svg{max-width:none;}
#canvas svg g.node{cursor:pointer;}
#canvas svg g.node>polygon,#canvas svg g.node>text,#canvas svg g.edge{transition:opacity .12s;}
#canvas svg .dim{opacity:.11;}
#canvas svg g.sel>polygon{stroke-width:3.4;}
#canvas svg g.lit>polygon{stroke-width:2.4;}
aside{width:392px;flex:none;border-left:1px solid var(--line);background:var(--panel);
  overflow:auto;padding:18px 20px 40px;}
.empty{color:var(--faint);font-size:13px;line-height:1.6;}
.pname{font-family:var(--mono);font-size:16px;font-weight:650;overflow-wrap:anywhere;}
.pill{display:inline-block;border:1px solid;border-radius:99px;padding:2px 9px;
  font-size:11px;font-weight:600;margin-top:7px;}
h4{margin:20px 0 7px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint);font-weight:650;}
.eq{font-family:var(--mono);font-size:12.5px;line-height:1.65;background:var(--sunk);
  border:1px solid var(--line);border-radius:5px;padding:9px 11px;overflow-wrap:anywhere;}
.chips{display:flex;flex-wrap:wrap;gap:5px;}
.chip{font-family:var(--mono);font-size:11.5px;padding:3px 8px;border-radius:4px;
  border:1px solid var(--line);background:var(--bg);color:var(--soft);cursor:pointer;}
.chip:hover{border-color:var(--accent);color:var(--accent);}
.none{font-size:12px;color:var(--faint);font-style:italic;}
table{border-collapse:collapse;width:100%;font-size:12px;}
td,th{padding:4px 8px;text-align:left;border-bottom:1px solid var(--line);}
th{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);}
td.n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums;}
pre{margin:0;font-family:var(--mono);font-size:11.5px;line-height:1.55;
  background:var(--sunk);border:1px solid var(--line);border-radius:5px;
  padding:11px;overflow:auto;max-height:46vh;white-space:pre;}
#tip{position:fixed;pointer-events:none;opacity:0;transition:opacity .1s;
  background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:7px 10px;font-family:var(--mono);font-size:11.5px;max-width:430px;
  box-shadow:0 6px 22px rgba(0,0,0,.17);z-index:9;}
#tip.on{opacity:1;}
#tip b{display:block;margin-bottom:3px;}
#tip span{color:var(--faint);}
@media(max-width:860px){.body{flex-direction:column;}
  aside{width:auto;border-left:0;border-top:1px solid var(--line);max-height:52vh;}}

e(W), multiply(X, multiply(Y, Z)))), X)) (peak)\n= { by lemma 44 }\n  multiply(add(multiply(multiply(Z, X), Y), multiply(X, multiply(Y, Z))), X)\n= { by lemma 50 R->L }\n  add(multiply(X, multiply(multiply(Y, Z), X)), multiply(multiply(multiply(Z, X), Y), X))\n= { by lemma 51 }\n  add(multiply(X, multiply(multiply(Y, Z), X)), multiply(Z, multiply(multiply(X, Y), X)))\n\nLemma 53: add(multiply(multiply(X, Y), multiply(Z, X)), multiply(Z, add(W, multiply(multiply(X, Y), X)))) = add(multiply(X, multiply(multiply(Y, Z), X)), multiply(Z, add(W, multiply(multiply(X, Y), X)))).\nProof:\n  add(multiply(multiply(X, Y), multiply(Z, X)), multiply(Z, add(W, multiply(multiply(X, Y), X))))\n= { by lemma 24 R->L }\n  add(multiply(Z, W), add(multiply(multiply(X, Y), multiply(Z, X)), multiply(Z, multiply(multiply(X, Y), X)))) (peak)\n= { by lemma 52 }\n  add(multiply(Z, W), add(multiply(X, multiply(multiply(Y, Z), X)), multiply(Z, multiply(multiply(X, Y), X))))\n= { by lemma 24 }\n  add(multiply(X, multiply(multiply(Y, Z), X)), multiply(Z, add(W, multiply(multiply(X, Y), X))))\n\nLemma 54: add(multiply(multiply(X, Y), multiply(Z, X)), multiply(Z, multiply(X, multiply(X, Y)))) = add(multiply(X, multiply(multiply(Y, Z), X)), multiply(Z, multiply(X, multiply(X, Y)))).\nProof:\n  add(multiply(multiply(X, Y), multiply(Z, X)), multiply(Z, multiply(X, multiply(X, Y))))\n= { by lemma 37 R->L }\n  add(multiply(multiply(X, Y), multiply(Z, X)), multiply(Z, add(commutator(X, additive_inverse(multiply(X, Y))), multiply(multiply(X, Y), X)))) (peak)\n= { by lemma 53 }\n  add(multiply(X, multiply(multiply(Y, Z), X)), multiply(Z, add(commutator(X, additive_inverse(multiply(X, Y))), multiply(multiply(X, Y), X))))\n= { by lemma 37 }\n  add(multiply(X, multiply(multiply(Y, Z), X)), multiply(Z, multiply(X, multiply(X, Y))))\n\nLemma 55: add(multiply(multiply(X, Y), multiply(Z, X)), multiply(multiply(Z, X), multiply(X, Y))) = add(multiply(X, multiply(multiply(Y, Z), X)), multiply(multiply(Z, X), multiply(X, Y))).\nProof:\n  add(multiply(multiply(X, Y), multiply(Z, X)), multiply(multiply(Z, X), multiply(X, Y)))\n= { by lemma 36 R->L }\n  add(associator(multiply(X, Y), Z, X), add(multiply(multiply(X, Y), multiply(Z, X)), multiply(Z, multiply(X, multiply(X, Y))))) (peak)\n= { by lemma 54 }\n  add(associator(multiply(X, Y), Z, X), add(multiply(X, multiply(multiply(Y, Z), X)), multiply(Z, multiply(X, multiply(X, Y)))))\n= { by lemma 36 }\n  add(multiply(X, multiply(multiply(Y, Z), X)), multiply(multiply(Z, X), multiply(X, Y)))\n\nLemma 56: add(multiply(multiply(X, Y), multiply(Z, X)), multiply(multiply(X, Y), multiply(Z, X))) = add(multiply(multiply(X, Y), multiply(Z, X)), multiply(X, multiply(multiply(Y, Z), X))).\nProof:\n  add(multiply(multiply(X, Y), multiply(Z, X)), multiply(multiply(X, Y), multiply(Z, X)))\n= { by lemma 28 R->L }\n  add(commutator(multiply(Z, X), multiply(X, Y)), add(multiply(multiply(X, Y), multiply(Z, X)), multiply(multiply(Z, X), multiply(X, Y)))) (peak)\n= { by lemma 55 }\n  add(commutator(multiply(Z, X), multiply(X, Y)), add(multiply(X, multiply(multiply(Y, Z), X)), multiply(multiply(Z, X), multiply(X, Y))))\n= { by lemma 28 }\n  add(multiply(X, multiply(multiply(Y, Z), X)), multiply(multiply(X, Y), multiply(Z, X)))\n= { by axiom 2 (commutativity_for_addition) }\n  add(multiply(multiply(X, Y), multiply(Z, X)), multiply(X, multiply(multiply(Y, Z), X)))\n\nLemma 57: add(additive_inverse(multiply(multiply(X, Y), multiply(Z, X))), additive_inverse(multiply(multiply(X, Y), multiply(Z, X)))) = add(additive_inverse(multiply(multiply(X, Y), multiply(Z, X))), additive_inverse(multiply(X, multiply(multiply(Y, Z), X)))).\nProof:\n  add(additive_inverse(multiply(multiply(X, Y), multiply(Z, X))), additive_inverse(multiply(multiply(X, Y), multiply(Z, X))))\n= { by lemma 32 R->L }\n  additive_inverse(add(multiply(multiply(X, Y), multiply(Z, X)), multiply(multiply(X, Y), multiply(Z, X)))) (peak)\n= { by lemma 56 }\n  additive_inverse(add(multiply(multiply(X, Y), multiply(Z, X)), multiply(X, multiply(multiply(Y, Z), X))))\n= { by lemma 32 }\n  add(additive_inverse(multiply(multiply(X, Y), multiply(Z, X))), additive_inverse(multiply(X, multiply(multiply(Y, Z), X))))\n\nLemma 58: additive_inverse(multiply(multiply(X, Y), multiply(Z, X))) = additive_inverse(multiply(X, multiply(multiply(Y, Z), X))).\nProof:\n  additive_inverse(multiply(multiply(X, Y), multiply(Z, X)))\n= { by lemma 35 R->L }\n  add(multiply(multiply(X, Y), multiply(Z, X)), add(additive_inverse(multiply(multiply(X, Y), multiply(Z, X))), additive_inverse(multiply(multiply(X, Y), multiply(Z, X))))) (peak)\n= { by lemma 57 }\n  add(multiply(multiply(X, Y), multiply(Z, X)), add(additive_inverse(multiply(multiply(X, Y), multiply(Z, X))), additive_inverse(multiply(X, multiply(multiply(Y, Z), X)))))\n= { by lemma 35 }\n  additive_inverse(multiply(X, multiply(multiply(Y, Z), X)))\n\nLemma 59: multiply(multiply(X, Y), multiply(Z, X)) = multiply(X, multiply(multiply(Y, Z), X)).\nProof:\n  multiply(multiply(X, Y), multiply(Z, X))\n= { by axiom 1 (additive_inverse_additive_inverse) R->L }\n  additive_inverse(additive_inverse(multiply(multiply(X, Y), multiply(Z, X)))) (peak)\n= { by lemma 58 }\n  additive_inverse(additive_inverse(multiply(X, multiply(multiply(Y, Z), X))))\n= { by axiom 1 (additive_inverse_additive_inverse) }\n  multiply(X, multiply(multiply(Y, Z), X))\n\nGoal 1 (goal): multiply(multiply(sk_dag_1, sk_dag_2), multiply(sk_dag_3, sk_dag_1)) = multiply(sk_dag_1, multiply(multiply(sk_dag_2, sk_dag_3), sk_dag_1)).\nProof:\n  multiply(multiply(sk_dag_1, sk_dag_2), multiply(sk_dag_3, sk_dag_1)) (peak)\n= { by lemma 59 }\n  multiply(sk_dag_1, multiply(multiply(sk_dag_2, sk_dag_3), sk_dag_1))", "goal": "Goal 1 (goal): multiply(multiply(sk_dag_1, sk_dag_2), multiply(sk_dag_3, sk_dag_1)) = multiply(sk_dag_1, multiply(multiply(sk_dag_2, sk_dag_3), sk_dag_1))."}};
const g=document.querySelector('#canvas svg'),panel=document.getElementById('panel'),
      tip=document.getElementById('tip');
const up=n=>{const s=new Set(),q=[n];while(q.length){const c=q.pop();
  for(const p of D[c].parents)if(!s.has(p)){s.add(p);q.push(p);}}return s;};
const down=n=>{const s=new Set(),q=[n];while(q.length){const c=q.pop();
  for(const k of D[c].children)if(!s.has(k)){s.add(k);q.push(k);}}return s;};
const el=n=>document.getElementById('node-'+n);
let selected=null,muted=new Set();

function clearFx(){g.querySelectorAll('.dim,.lit,.sel').forEach(e=>
  e.classList.remove('dim','lit','sel'));}

function light(n,sel){
  clearFx();
  const keep=new Set([n,...up(n),...down(n)]);
  for(const k in D){const e=el(k);if(!e)continue;
    if(keep.has(k)){e.classList.add(k===n?'sel':'lit');}else{e.classList.add('dim');}}
  g.querySelectorAll('g.edge').forEach(e=>{
    const m=(e.id||'').slice(5).split('__');
    if(!(m.length===2&&keep.has(m[0])&&keep.has(m[1])))e.classList.add('dim');});
  if(sel)selected=n;
}

function restore(){
  clearFx();
  if(selected){light(selected,false);return;}
  if(muted.size)for(const k in D)
    if(muted.has(D[k].status))el(k)?.classList.add('dim');
}

const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const chips=(a)=>a.length?`<div class="chips">${a.map(x=>
  `<button class="chip" data-go="${x}">${esc(x)}</button>`).join('')}</div>`
  :'<div class="none">none</div>';

function show(n){
  const d=D[n];
  const runs=d.runs.length?`<h4>runs</h4><table><tr><th>direction</th><th>result</th>
    <th style="text-align:right">cpu</th></tr>${d.runs.map(r=>
    `<tr><td>${esc(r.direction)}</td><td>${esc(r.result)}</td>
     <td class="n">${r.cpu==null?'—':r.cpu.toFixed(1)+'s'}</td></tr>`).join('')}</table>`:'';
  panel.innerHTML=`<div class="pname">${esc(n)}</div>
    <span class="pill n-${d.status}">${esc(d.label)}</span>
    <h4>statement</h4><div class="eq">${esc(d.lhs)}<br>= ${esc(d.rhs)}</div>
    ${d.goal?`<h4>as sent to twee</h4><div class="eq">${esc(d.goal)}</div>`:''}
    <h4>depends on</h4>${chips(d.parents)}
    <h4>needed by</h4>${chips(d.children)}
    ${runs}
    <h4>proof</h4>${d.proof?`<pre>${esc(d.proof)}</pre>`
      :'<div class="none">no proof found yet</div>'}`;
  panel.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{
    const t=b.dataset.go;light(t,true);show(t);
    el(t)?.scrollIntoView({behavior:'smooth',block:'center',inline:'center'});});
}

g.querySelectorAll('g.node').forEach(node=>{
  const n=(node.id||'').slice(5); if(!D[n])return;
  node.addEventListener('mouseenter',e=>{
    if(!selected)light(n,false);
    const d=D[n];
    tip.innerHTML=`<b>${esc(n)}</b>${esc(d.lhs)} = ${esc(d.rhs)}
      <span><br>${esc(d.label)}${d.cpu!=null?' · '+d.cpu.toFixed(1)+'s':''}
      · ${d.parents.length} parent(s), ${d.children.length} dependent(s)</span>`;
    tip.classList.add('on');});
  node.addEventListener('mousemove',e=>{
    const r=tip.getBoundingClientRect();
    tip.style.left=Math.min(e.clientX+14,innerWidth-r.width-12)+'px';
    tip.style.top=Math.min(e.clientY+16,innerHeight-r.height-12)+'px';});
  node.addEventListener('mouseleave',()=>{tip.classList.remove('on');
    if(!selected)restore();});
  node.addEventListener('click',ev=>{ev.stopPropagation();light(n,true);show(n);});
});

document.querySelectorAll('.key').forEach(k=>k.onclick=()=>{
  const s=k.dataset.status;
  muted.has(s)?muted.delete(s):muted.add(s);
  k.classList.toggle('off',muted.has(s));
  selected=null;restore();});

document.getElementById('canvas').addEventListener('click',()=>{
  selected=null;panel.innerHTML=document.querySelector('.empty')?panel.innerHTML:'';
  panel.innerHTML='<div class="empty">Hover a node to trace its dependencies. '
    +'Click one for its statement and proof.</div>';restore();});
addEventListener('keydown',e=>{if(e.key==='Escape'){selected=null;
  panel.innerHTML='<div class="empty">Hover a node to trace its dependencies. '
    +'Click one for its statement and proof.</div>';restore();}});
</script>
